<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890" font-family="Arial, Helvetica, sans-serif" fill="#111111">
  <title>Overall use case diagram: Multilingual Crisis Monitoring and Departmental Routing System</title>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#111111" stroke-width="1.5"/>
    </marker>
    <g id="actor" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round">
      <circle cx="0" cy="-28" r="14" fill="#ffffff"/>
      <path d="M0 -14 V28 M-24 0 H24 M0 28 L-20 66 M0 28 L20 66"/>
    </g>
    <style>
      .uc { fill: #ffffff; stroke: #111111; stroke-width: 1.8; }
      .assoc { fill: none; stroke: #111111; stroke-width: 1.5; }
      .dep { fill: none; stroke: #111111; stroke-width: 1.4; stroke-dasharray: 7 5; marker-end: url(#open); }
      .name { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 13px; text-anchor: middle; fill: #333333; }
      .actor { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .stereo { font-size: 13px; font-style: italic; text-anchor: middle; }
      .cond { font-size: 12px; text-anchor: middle; fill: #333333; }
    </style>
  </defs>

  <rect width="1400" height="890" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="300" y="24" width="810" height="836" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="705" y="58" font-size="18" font-weight="700" text-anchor="middle">Multilingual Crisis Monitoring and Departmental Routing System</text>

  <!-- Actor associations -->
  <path class="assoc" d="M160 130 H350"/>
  <path class="assoc" d="M160 390 H350"/>
  <path class="assoc" d="M1240 530 L1060 520"/>
  <path class="assoc" d="M1240 530 L1056 640"/>
  <path class="assoc" d="M1240 730 L1056 660"/>
  <path class="assoc" d="M1240 730 L1056 770"/>

  <!-- Dependencies -->
  <path class="dep" d="M610 130 H800"/>
  <path class="dep" d="M930 172 V218"/>
  <path class="dep" d="M800 390 H610"/>

  <!-- Dependency labels -->
  <rect x="664" y="110" width="82" height="16" fill="#ffffff"/>
  <text class="stereo" x="705" y="122">«include»</text>
  <rect x="940" y="186" width="74" height="18" fill="#ffffff"/>
  <text class="stereo" x="977" y="200">«include»</text>
  <text class="stereo" x="705" y="378">«extend»</text>
  <text class="cond" x="705" y="410">[approved or marked fake]</text>

  <!-- Use cases: left column -->
  <ellipse class="uc" cx="480" cy="130" rx="130" ry="42"/>
  <text class="name" x="480" y="126">Ingest Social</text>
  <text class="name" x="480" y="146">Media Posts</text>

  <ellipse class="uc" cx="480" cy="390" rx="130" ry="42"/>
  <text class="name" x="480" y="386">Review Situation</text>
  <text class="sub" x="480" y="406">(Approve, Mark Fake, Skip)</text>

  <!-- Use cases: right column -->
  <ellipse class="uc" cx="930" cy="130" rx="130" ry="42"/>
  <text class="name" x="930" y="126">Analyse Posts</text>
  <text class="sub" x="930" y="146">(Language, Sentiment, Needs)</text>

  <ellipse class="uc" cx="930" cy="260" rx="130" ry="42"/>
  <text class="name" x="930" y="256">Build Situations</text>
  <text class="sub" x="930" y="276">(Cluster, Score, Summarise)</text>

  <ellipse class="uc" cx="930" cy="390" rx="130" ry="42"/>
  <text class="name" x="930" y="386">Route Tickets</text>
  <text class="name" x="930" y="406">to Departments</text>

  <ellipse class="uc" cx="930" cy="520" rx="130" ry="42"/>
  <text class="name" x="930" y="516">Acknowledge and</text>
  <text class="name" x="930" y="536">Resolve Tickets</text>

  <ellipse class="uc" cx="930" cy="650" rx="130" ry="42"/>
  <text class="name" x="930" y="646">Monitor Analytics</text>
  <text class="name" x="930" y="666">Dashboard</text>

  <ellipse class="uc" cx="930" cy="780" rx="130" ry="42"/>
  <text class="name" x="930" y="776">View Daily</text>
  <text class="name" x="930" y="796">Situation Reports</text>

  <!-- Actors: left -->
  <use href="#actor" x="130" y="130"/>
  <text class="actor" x="130" y="220">Social Media Source</text>
  <text class="actor" x="130" y="239">/ Simulator</text>

  <use href="#actor" x="130" y="390"/>
  <text class="actor" x="130" y="480">Human Reviewer</text>

  <!-- Actors: right -->
  <use href="#actor" x="1270" y="530"/>
  <text class="actor" x="1270" y="620">Department Officer</text>

  <use href="#actor" x="1270" y="730"/>
  <text class="actor" x="1270" y="820">Admin / Analyst</text>
</svg>
